[project]
name = "ticket-mcp-server-python"
version = "1.0.0"
description = "Ticket MCP server (Python implementation): getTicket, listOpenTickets, listTickets, listCustomers and createTicket over SSE"
requires-python = ">=3.12"
dependencies = ["mcp>=1.20,<2", "starlette>=0.40", "uvicorn>=0.30"]

[project.scripts]
ticket-server = "ticket_server.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ticket_server"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
