spring.application.name=assistant
server.port=8080

# Local LLM via Ollama (free, no API key). Needs: ollama pull llama3.1
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.1
spring.ai.ollama.chat.options.temperature=0.2

# MCP client -> ticket-mcp-server (start it first)
spring.ai.mcp.client.sse.connections.tickets.url=http://localhost:8081
spring.ai.mcp.client.initialized=true
