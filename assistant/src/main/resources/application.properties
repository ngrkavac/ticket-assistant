spring.application.name=assistant
server.port=8080
server.shutdown=graceful
# Blocking LLM calls: use virtual threads instead of the small platform thread pool
spring.threads.virtual.enabled=true
spring.lifecycle.timeout-per-shutdown-phase=30s
server.error.include-message=never
server.error.include-stacktrace=never

# Local LLM via Ollama (free, no API key). Needs: ollama pull llama3.1
spring.ai.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:llama3.1}
spring.ai.ollama.chat.options.temperature=0.2
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=120s

# ONNX embedding model is downloaded once and cached here (mount a volume in containers)
spring.ai.embedding.transformer.cache.enabled=true
spring.ai.embedding.transformer.cache.directory=${EMBEDDING_CACHE_DIR:${java.io.tmpdir}/spring-ai-onnx}

# MCP client -> ticket-mcp-server (must be reachable at startup)
spring.ai.mcp.client.sse.connections.tickets.url=${TICKETS_MCP_URL:http://localhost:8081}
spring.ai.mcp.client.request-timeout=20s
# MCP client -> request-log-mcp-server (stores every /ask request in its database; must be reachable at startup)
spring.ai.mcp.client.sse.connections.requestlog.url=${REQUEST_LOG_MCP_URL:http://localhost:8082}

# App settings. Set HELPDESK_API_KEY to require the X-API-Key header on /ask.
helpdesk.max-question-length=1000
# Longest question that can be added to the UI catalog (POST /questions); at most 1000, the request-log server's limit
helpdesk.max-catalog-question-length=1000
helpdesk.max-concurrent-requests=8
# How long /ask waits for a free slot before answering 429, and the Retry-After sent with it
helpdesk.queue-wait=${HELPDESK_QUEUE_WAIT:1s}
helpdesk.retry-after=${HELPDESK_RETRY_AFTER:5s}
# classpath:kb/*.md (bundled) or e.g. file:/data/kb/*.md (mounted volume)
helpdesk.kb.location=${KB_LOCATION:classpath:kb/*.md}
helpdesk.rag.top-k=3
helpdesk.rag.similarity-threshold=0.3
helpdesk.security.api-key=${HELPDESK_API_KEY:}
helpdesk.request-log.enabled=${REQUEST_LOG_ENABLED:true}
helpdesk.request-log.connection=requestlog
# Background request-log writes: concurrent writers and how many may wait; extra writes are dropped
# (helpdesk_requestlog_writes_total{outcome="dropped"}) instead of slowing down /ask
helpdesk.request-log.write-threads=${REQUEST_LOG_WRITE_THREADS:4}
helpdesk.request-log.queue-capacity=${REQUEST_LOG_QUEUE_CAPACITY:1000}

# Operations: actuator is on its own port; do not publish it outside the cluster/host
management.server.port=${MANAGEMENT_PORT:9090}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
logging.pattern.level=%5p [%X{requestId:-}]
# Failed MCP tool calls (e.g. unknown ticket id) are expected and returned to the model; ChatConfig logs
# them at WARN, so Spring AI's own ERROR line for them is turned off.
logging.level.org.springframework.ai.mcp.SyncMcpToolCallback=OFF
management.endpoint.health.group.readiness.include=readinessState,knowledgeBase
