spring.application.name=assistant
server.port=8080
server.shutdown=graceful
# Blocking LLM calls: use virtual threads instead of the small platform thread pool
spring.threads.virtual.enabled=true
spring.lifecycle.timeout-per-shutdown-phase=30s
server.error.include-message=never
server.error.include-stacktrace=never

# Local LLM via Ollama (free, no API key). Needs: ollama pull llama3.1
spring.ai.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:llama3.1}
spring.ai.ollama.chat.options.temperature=0.2
# Upper bound on the tokens the model may generate per chat call (Ollama's num_predict). A model
# that gets stuck in a loop (small models such as qwen2.5:0.5b do now and then) is cut off here
# instead of holding the /ask request until a timeout; the answer is then just shorter. Normal
# answers need a few hundred tokens. Set OLLAMA_NUM_PREDICT=-1 for no limit.
spring.ai.ollama.chat.options.num-predict=${OLLAMA_NUM_PREDICT:1024}
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=120s

# ONNX embedding model (all-MiniLM-L6-v2) and its tokenizer. By default both are downloaded from
# GitHub at startup and cached in EMBEDDING_CACHE_DIR (mount a volume in containers). Images with the
# files baked in set EMBEDDING_MODEL_URI/EMBEDDING_TOKENIZER_URI (K8) to file: paths, e.g.
# file:/opt/models/all-MiniLM-L6-v2/model.onnx, so pods need no internet; file: and classpath: URIs
# are read in place and not cached.
spring.ai.embedding.transformer.onnx.model-uri=${EMBEDDING_MODEL_URI:https://media.githubusercontent.com/media/spring-projects/spring-ai/refs/heads/main/models/spring-ai-transformers/src/main/resources/onnx/all-MiniLM-L6-v2/model.onnx}
spring.ai.embedding.transformer.tokenizer.uri=${EMBEDDING_TOKENIZER_URI:https://raw.githubusercontent.com/spring-projects/spring-ai/main/models/spring-ai-transformers/src/main/resources/onnx/all-MiniLM-L6-v2/tokenizer.json}
spring.ai.embedding.transformer.cache.enabled=true
spring.ai.embedding.transformer.cache.directory=${EMBEDDING_CACHE_DIR:${java.io.tmpdir}/spring-ai-onnx}

# MCP clients, Streamable HTTP (K6). TICKETS_MCP_URL and REQUEST_LOG_MCP_URL are base URLs
# (scheme, host, port); the MCP endpoint /mcp is appended.
# ticket-mcp-server:
spring.ai.mcp.client.streamable-http.connections.tickets.url=${TICKETS_MCP_URL:http://localhost:8081}
spring.ai.mcp.client.streamable-http.connections.tickets.endpoint=/mcp
# request-log-mcp-server (stores every /ask request in its database):
spring.ai.mcp.client.streamable-http.connections.requestlog.url=${REQUEST_LOG_MCP_URL:http://localhost:8082}
spring.ai.mcp.client.streamable-http.connections.requestlog.endpoint=/mcp
spring.ai.mcp.client.request-timeout=20s
# Lazy: no MCP server has to be up at startup. A session is opened on the first call and opened
# again after a server restart (McpClientSupervisor); until then calls fail with 503.
spring.ai.mcp.client.initialized=false
# The model's tools come from ChatConfig.mcpToolCallbacks (ticket tools only), not from Spring AI's
# provider, which would also list the request-log server's tools.
spring.ai.mcp.client.toolcallback.enabled=false
# Service tokens (K5): sent as "Authorization: Bearer <token>" on every request to that connection's
# server (McpServiceTokens). Blank sends no header, for servers without a token (local development).
helpdesk.mcp.tokens.tickets=${TICKETS_MCP_TOKEN:}
helpdesk.mcp.tokens.requestlog=${REQUEST_LOG_MCP_TOKEN:}

# Authentication (K1/K2): every app endpoint needs a bearer JWT from this OIDC issuer whose aud
# contains OIDC_AUDIENCE. Without an issuer the app refuses to start, except in the 'local' profile
# (application-local.properties), which uses the optional X-API-Key instead.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:}
spring.security.oauth2.resourceserver.jwt.audiences=${OIDC_AUDIENCE:helpdesk-assistant}
# Optional: fetch signing keys here instead of from the issuer's discovery document (for when the
# issuer URL in the tokens is not reachable from the assistant). The issuer is still validated.
helpdesk.security.jwk-set-uri=${OIDC_JWK_SET_URI:}
# JWT claims with the user's roles (helpdesk-agent, helpdesk-admin, tickets-write) and allowed
# customer ids (["*"] = all). A dotted name reads a nested claim, e.g. realm_access.roles.
helpdesk.security.roles-claim=${OIDC_ROLES_CLAIM:roles}
helpdesk.security.customers-claim=${OIDC_CUSTOMERS_CLAIM:customers}

# App settings
helpdesk.max-question-length=1000
# Longest question that can be added to the UI catalog (POST /questions); at most 1000, the request-log server's limit
helpdesk.max-catalog-question-length=1000
helpdesk.max-concurrent-requests=8
# How long /ask waits for a free slot before answering 429, and the Retry-After sent with it
helpdesk.queue-wait=${HELPDESK_QUEUE_WAIT:1s}
helpdesk.retry-after=${HELPDESK_RETRY_AFTER:5s}
# Per-user limit on /ask: questions per minute per user (JWT sub), per pod; more get 429 with a
# Retry-After (helpdesk_ask_rejected_total{reason="rate_limit"}). 0 turns the limit off.
helpdesk.rate-limit.asks-per-minute=${RATE_LIMIT_ASKS_PER_MINUTE:20}
# How long the ticket server's customer list (listCustomers) is cached; 0s disables the cache
helpdesk.customers-cache-ttl=${HELPDESK_CUSTOMERS_CACHE_TTL:60s}
# classpath:kb/*.md (bundled) or e.g. file:/data/kb/*.md (mounted volume)
helpdesk.kb.location=${KB_LOCATION:classpath:kb/*.md}
helpdesk.rag.top-k=3
helpdesk.rag.similarity-threshold=0.3
helpdesk.request-log.enabled=${REQUEST_LOG_ENABLED:true}
helpdesk.request-log.connection=requestlog
# Background request-log writes: concurrent writers and how many may wait; extra writes are dropped
# (helpdesk_requestlog_writes_total{outcome="dropped"}) instead of slowing down /ask
helpdesk.request-log.write-threads=${REQUEST_LOG_WRITE_THREADS:4}
helpdesk.request-log.queue-capacity=${REQUEST_LOG_QUEUE_CAPACITY:1000}

# Operations: actuator is on its own port; do not publish it outside the cluster/host
management.server.port=${MANAGEMENT_PORT:9090}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
logging.pattern.level=%5p [%X{requestId:-}]
# Failed MCP tool calls (e.g. unknown ticket id) are expected and returned to the model; ChatConfig logs
# them at WARN, so Spring AI's own ERROR line for them is turned off.
logging.level.org.springframework.ai.mcp.SyncMcpToolCallback=OFF
management.endpoint.health.group.readiness.include=readinessState,knowledgeBase
