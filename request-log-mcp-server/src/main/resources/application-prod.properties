# Production: PostgreSQL only. REQUEST_LOG_DB_URL, REQUEST_LOG_DB_USER and REQUEST_LOG_DB_PASSWORD
# are required (no defaults), and DatabaseUrlGuard rejects anything but a jdbc:postgresql: URL.
spring.datasource.url=${REQUEST_LOG_DB_URL}
spring.datasource.username=${REQUEST_LOG_DB_USER}
spring.datasource.password=${REQUEST_LOG_DB_PASSWORD}
