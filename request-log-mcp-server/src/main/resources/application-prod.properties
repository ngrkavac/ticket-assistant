# Production. ProdConfigGuard fails startup with one message listing every missing setting:
#   REQUEST_LOG_DB_URL (a jdbc:postgresql: URL), REQUEST_LOG_DB_USER, REQUEST_LOG_DB_PASSWORD,
#   REQUEST_LOG_DB_MIGRATION_USER (must differ from REQUEST_LOG_DB_USER),
#   REQUEST_LOG_DB_MIGRATION_PASSWORD,
#   MCP_SERVICE_TOKEN (K5).
# Flyway runs as the migration user (DDL), the application user gets DML rights only.
# Other profiles only need REQUEST_LOG_DB_URL (DatabaseUrlGuard); compose runs without a profile.
spring.datasource.url=${REQUEST_LOG_DB_URL}
spring.datasource.username=${REQUEST_LOG_DB_USER}
spring.datasource.password=${REQUEST_LOG_DB_PASSWORD}
# JSON logs (T4.1): Elastic Common Schema on the console, one object per line, with traceId and
# spanId from the MDC. Logs never contain tool arguments or results (e.g. questions and answers).
logging.structured.format.console=ecs
