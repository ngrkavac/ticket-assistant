# Production: PostgreSQL only. REQUEST_LOG_DB_URL, REQUEST_LOG_DB_USER and REQUEST_LOG_DB_PASSWORD
# are required (no defaults), and DatabaseUrlGuard rejects anything but a jdbc:postgresql: URL.
# REQUEST_LOG_DB_MIGRATION_USER and REQUEST_LOG_DB_MIGRATION_PASSWORD are required too (see
# application.properties): the application user gets DML rights only.
spring.datasource.url=${REQUEST_LOG_DB_URL}
spring.datasource.username=${REQUEST_LOG_DB_USER}
spring.datasource.password=${REQUEST_LOG_DB_PASSWORD}
# MCP_SERVICE_TOKEN is required too (McpServiceAuthConfig, K5): startup fails without it.
# JSON logs (T4.1): Elastic Common Schema on the console, one object per line, with traceId and
# spanId from the MDC. Logs never contain tool arguments or results (e.g. questions and answers).
logging.structured.format.console=ecs
