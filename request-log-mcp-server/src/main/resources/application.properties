spring.application.name=request-log-mcp-server
server.port=8082
server.shutdown=graceful
spring.ai.mcp.server.name=request-log-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC

# Defaults to in-memory H2 (data is lost on restart). Compose points this at PostgreSQL.
spring.datasource.url=${REQUEST_LOG_DB_URL:jdbc:h2:mem:requestlog;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${REQUEST_LOG_DB_USER:sa}
spring.datasource.password=${REQUEST_LOG_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
