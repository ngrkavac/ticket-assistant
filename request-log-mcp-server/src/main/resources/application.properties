spring.application.name=request-log-mcp-server
server.port=8082
server.shutdown=graceful
spring.ai.mcp.server.name=request-log-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
# MCP transport (K6): Streamable HTTP at POST /mcp, in its stateless mode: no Mcp-Session-Id, every
# POST is answered on its own, so any replica can serve any request (no sticky sessions behind a
# Kubernetes Service). The server never calls the client, so it needs no session. The legacy
# HTTP+SSE transport (GET /sse, POST /mcp/message) is not served any more.
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp

# No default database: startup fails (DatabaseUrlGuard) if REQUEST_LOG_DB_URL is unset, so a misconfigured pod
# cannot silently fall back to an in-memory database and lose data.
# For a quick local run use the "local" profile (in-memory H2), see application-local.properties.
spring.datasource.url=${REQUEST_LOG_DB_URL}
spring.datasource.username=${REQUEST_LOG_DB_USER}
spring.datasource.password=${REQUEST_LOG_DB_PASSWORD}
# Connection pool: fail fast instead of queueing request threads when the database is slow or gone.
spring.datasource.hikari.maximum-pool-size=${REQUEST_LOG_DB_POOL_SIZE:5}
# Hikari takes milliseconds.
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000
# Server-side statement_timeout for pooled PostgreSQL connections (DatabaseTimeoutsConfig); 0 = off.
request-log.db.statement-timeout=${REQUEST_LOG_DB_STATEMENT_TIMEOUT:5s}

# Least privilege (MigrationUserConfig): Flyway runs as this user (DDL, owns the tables) and grants
# the application user (REQUEST_LOG_DB_USER) DML only. Required in the prod profile; when empty,
# Flyway uses the application user.
request-log.migration.user=${REQUEST_LOG_DB_MIGRATION_USER:}
request-log.migration.password=${REQUEST_LOG_DB_MIGRATION_PASSWORD:}

# Retention (RetentionPurgeJob): request-log rows older than this are deleted. ISO-8601, at least P1D.
request-log.retention=${REQUEST_LOG_RETENTION:P90D}
request-log.purge.enabled=true
# Daily at 03:17 UTC (Spring cron: second minute hour day month weekday).
request-log.purge.cron=0 17 3 * * *
request-log.purge.batch-size=1000
# Upper bound per run (1000 x 1000 rows); a larger backlog is worked off over the next runs.
request-log.purge.max-batches=1000
# ShedLock: a crashed replica's lock expires after lock-at-most-for; lock-at-least-for keeps a
# replica whose scheduler fires a little later from repeating a run that another one just finished.
request-log.purge.lock-at-most-for=PT30M
request-log.purge.lock-at-least-for=PT1M

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
# Observability (T4.1-T4.3). The actuator shares the app port (K7): probes and /actuator/prometheus
# are served on the same port as MCP, without the service token; a NetworkPolicy keeps the port
# internal. To give /actuator/** its own port instead, set MANAGEMENT_SERVER_PORT (e.g. 9091) and
# point the probes and the Prometheus scrape at it.
# Metrics: http_server_requests_seconds (with histogram buckets for p95/p99 alerts), hikaricp_*,
# jvm_* and the application's own metrics, each tagged with application=<this server>.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}
# Tracing (OpenTelemetry bridge): incoming W3C traceparent headers are continued, traceId/spanId go
# to the logs (MDC). Spans are exported over OTLP/HTTP only when OTEL_EXPORTER_OTLP_ENDPOINT is set
# (collector base URL, e.g. http://otel-collector:4318; see OtlpTracingConfig).
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}

# Service-to-service auth (K5, McpServiceAuthConfig): every MCP request must carry
# "Authorization: Bearer <MCP_SERVICE_TOKEN>". Blank disables the check with a warning, for local
# development only (startup fails in the prod profile). Requests with an Origin header not in
# MCP_ALLOWED_ORIGINS (comma-separated, empty by default) get 403. /actuator/** stays open.
mcp.service-token=${MCP_SERVICE_TOKEN:}
mcp.allowed-origins=${MCP_ALLOWED_ORIGINS:}
