# Local development: in-memory H2 (data is lost on restart), no external database needed.
# Run with: ./mvnw -pl request-log-mcp-server spring-boot:run -Dspring-boot.run.profiles=local
# REQUEST_LOG_DB_URL still wins if set, e.g. to point a local run at PostgreSQL.
spring.datasource.url=${REQUEST_LOG_DB_URL:jdbc:h2:mem:requestlog;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${REQUEST_LOG_DB_USER:sa}
spring.datasource.password=${REQUEST_LOG_DB_PASSWORD:}
