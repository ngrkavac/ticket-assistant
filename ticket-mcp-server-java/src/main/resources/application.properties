spring.application.name=ticket-mcp-server-java
server.port=8081
server.shutdown=graceful
spring.ai.mcp.server.name=ticket-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC

# Tickets are stored in PostgreSQL (D1). No default database: startup fails (TicketsDatabaseUrlGuard)
# if TICKETS_DB_URL is unset, so a misconfigured pod cannot silently run on an in-memory database.
# For a quick local run with demo data use the "local" profile, see application-local.properties.
spring.datasource.url=${TICKETS_DB_URL}
spring.datasource.username=${TICKETS_DB_USER}
spring.datasource.password=${TICKETS_DB_PASSWORD}
# Schema only. The demo data (db/seed) is added in the "local" profile.
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
