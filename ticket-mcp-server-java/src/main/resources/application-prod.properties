# Production: PostgreSQL only and no demo data. TICKETS_DB_URL, TICKETS_DB_USER and
# TICKETS_DB_PASSWORD are required (no defaults), and TicketsDatabaseUrlGuard rejects anything but
# a jdbc:postgresql: URL. Customers are added by an operator (see db/migration/V1__tickets.sql).
spring.datasource.url=${TICKETS_DB_URL}
spring.datasource.username=${TICKETS_DB_USER}
spring.datasource.password=${TICKETS_DB_PASSWORD}
spring.flyway.locations=classpath:db/migration
