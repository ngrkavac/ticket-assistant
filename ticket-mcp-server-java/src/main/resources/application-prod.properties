# Production. ProdConfigGuard fails startup with one message listing every missing setting:
#   TICKETS_DB_URL (a jdbc:postgresql: URL), TICKETS_DB_USER, TICKETS_DB_PASSWORD,
#   TICKETS_DB_MIGRATION_USER (must differ from TICKETS_DB_USER), TICKETS_DB_MIGRATION_PASSWORD,
#   MCP_SERVICE_TOKEN (K5).
# Flyway runs as the migration user (DDL), the application user gets DML rights only.
# No demo data: customers are added by an operator (see db/migration/V1__tickets.sql).
# Other profiles only need TICKETS_DB_URL (TicketsDatabaseUrlGuard); compose runs without a profile.
spring.datasource.url=${TICKETS_DB_URL}
spring.datasource.username=${TICKETS_DB_USER}
spring.datasource.password=${TICKETS_DB_PASSWORD}
spring.flyway.locations=classpath:db/migration
# JSON logs (T4.1): Elastic Common Schema on the console, one object per line, with traceId and
# spanId from the MDC. Logs never contain tool arguments or results (e.g. questions and answers).
logging.structured.format.console=ecs
