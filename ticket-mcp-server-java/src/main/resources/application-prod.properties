# Production: PostgreSQL only and no demo data. TICKETS_DB_URL, TICKETS_DB_USER and
# TICKETS_DB_PASSWORD are required (no defaults), and TicketsDatabaseUrlGuard rejects anything but
# a jdbc:postgresql: URL. TICKETS_DB_MIGRATION_USER and TICKETS_DB_MIGRATION_PASSWORD are required
# too (see application.properties): the application user gets DML rights only. Customers are added
# by an operator (see db/migration/V1__tickets.sql).
spring.datasource.url=${TICKETS_DB_URL}
spring.datasource.username=${TICKETS_DB_USER}
spring.datasource.password=${TICKETS_DB_PASSWORD}
spring.flyway.locations=classpath:db/migration
# MCP_SERVICE_TOKEN is required too (McpServiceAuthConfig, K5): startup fails without it.
