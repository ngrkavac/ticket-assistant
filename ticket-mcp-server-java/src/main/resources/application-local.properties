# Local development: in-memory H2 (data is lost on restart) with the demo customers and tickets.
# Run with: ./mvnw -pl ticket-mcp-server-java spring-boot:run -Dspring-boot.run.profiles=local
# TICKETS_DB_URL still wins if set, e.g. to run the contract tests against PostgreSQL with demo data.
spring.datasource.url=${TICKETS_DB_URL:jdbc:h2:mem:tickets;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${TICKETS_DB_USER:sa}
spring.datasource.password=${TICKETS_DB_PASSWORD:}
# Demo data only here, never in prod.
spring.flyway.locations=classpath:db/migration,classpath:db/seed
