name: CI
# Branch pushes are built through their pull request only, so each commit runs CI once.
on:
  push: {branches: [main]}
  pull_request: {}
# Least privilege for GITHUB_TOKEN; a job that needs more must ask for it explicitly.
permissions:
  contents: read
# A newer push to the same pull request cancels its still-running build. Runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Actions are pinned by commit SHA (tag in the comment); Renovate keeps both up to date.
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: {distribution: temurin, java-version: 21, cache: maven}
      - run: ./mvnw -B verify

  ui:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: ui}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22, cache: npm, cache-dependency-path: ui/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: ticket-mcp-server-python}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with: {version: 0.12.22, enable-cache: true}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Lint contract tests
        working-directory: ticket-mcp-contract-tests
        run: uv sync --locked && uv run ruff check . && uv run ruff format --check .

  rust:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: ticket-mcp-server-rust}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: {workspaces: ticket-mcp-server-rust}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # Builds each ticket server's image, starts it, and runs the shared black-box MCP contract
  # tests against it, so all three implementations are proven to behave identically.
  contract:
    needs: [java, python, rust]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {impl: java, context: ., build-args: "MODULE=ticket-mcp-server-java"}
          - {impl: python, context: ticket-mcp-server-python, build-args: ""}
          - {impl: rust, context: ticket-mcp-server-rust, build-args: ""}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.build-args }}
          tags: ticket-mcp-server-${{ matrix.impl }}
          load: true
          cache-from: type=gha,scope=${{ matrix.impl }}
          cache-to: type=gha,mode=max,scope=${{ matrix.impl }}
      - name: Start server
        run: |
          docker run -d --name server -p 8081:8081 ticket-mcp-server-${{ matrix.impl }}
          for i in $(seq 1 60); do
            curl -fs localhost:8081/actuator/health/readiness && exit 0
            sleep 1
          done
          docker logs server; exit 1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with: {version: 0.12.22, enable-cache: true}
      - name: Contract tests
        working-directory: ticket-mcp-contract-tests
        run: uv sync --locked && uv run pytest -v
        env: {TICKETS_MCP_URL: "http://localhost:8081"}
      - if: always()
        run: docker logs server
