# Trivy exceptions for the Images workflow (.github/workflows/images.yml). Each entry names the
# CVE, the package it is accepted for (purls), the reason and an expiry: after expired_at the
# finding fails the gate again. Add entries only with the maintainers' explicit approval.
vulnerabilities:
  # spring-webmvc 6.2.19 is managed by Spring Boot 3.5.16, the newest 3.5.x. Spring Framework 6.2.x
  # has no fix; it is fixed in 7.0.9, which needs Spring Boot 4.x.
  - id: CVE-2026-47884
    purls: ["pkg:maven/org.springframework/spring-webmvc"]
    statement: fixed only in Spring Boot 4.x (Spring Framework 7.0.9); revisit with the Boot 4 upgrade
    expired_at: 2027-02-28
  - id: CVE-2026-47890
    purls: ["pkg:maven/org.springframework/spring-webmvc"]
    statement: fixed only in Spring Boot 4.x (Spring Framework 7.0.9); revisit with the Boot 4 upgrade
    expired_at: 2027-02-28
  # mcp-core 0.18.3 comes from Spring AI 1.1.8, the newest 1.1.x. It is fixed in MCP Java SDK 1.0.0,
  # which only Spring AI 2.0 (on Spring Boot 4.x) brings.
  - id: CVE-2026-35568
    purls: ["pkg:maven/io.modelcontextprotocol.sdk/mcp-core"]
    statement: fixed only in Spring Boot 4.x / Spring AI 2.0 (MCP Java SDK 1.0.0); revisit with the Boot 4 upgrade
    expired_at: 2027-02-28
