[project]
name = "ticket-mcp-contract-tests"
version = "0.1.0"
description = "Black-box MCP contract tests every ticket-mcp-server implementation must pass"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["mcp>=1.30,<2", "pytest>=8", "httpx>=0.27", "ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-p anyio"

[tool.ruff]
line-length = 100
