# Staging: one replica per service, the smallest Ollama. Applied on top of values.yaml:
#   helm upgrade --install helpdesk deploy/helm/helpdesk -n helpdesk-staging \
#     -f deploy/helm/helpdesk/values-staging.yaml --set global.imageTag=sha-<short>
# Host names and URLs below are placeholders: replace them with the real staging ones.
# Secrets are not set here; the Secrets named in values.yaml ("secrets") must exist (C11b).

global:
  # The release workflow (C13) deploys every main build to staging with its sha-<short> tag.
  imageTag: ""
  tracingSamplingProbability: "1.0"

publicHost: helpdesk.staging.example.com

oidc:
  issuerUri: https://sso.staging.example.com/realms/helpdesk

ollama:
  # C11c replaces this with the in-chart Ollama StatefulSet.
  url: http://ollama.ollama.svc.cluster.local:11434
  capacity:
    replicas: 1
    numParallel: 4

assistant:
  maxConcurrentRequests: 2
  hpa:
    minReplicas: 1
    maxReplicas: 2

ticketServer:
  implementation: java
  replicas: 1
  java:
    db:
      # C11c: Postgres for staging.
      url: jdbc:postgresql://tickets-db.helpdesk-staging.svc.cluster.local:5432/tickets

requestLogServer:
  replicas: 1
  # Short retention: staging holds test traffic only.
  retention: P14D
  db:
    url: jdbc:postgresql://request-log-db.helpdesk-staging.svc.cluster.local:5432/requestlog

ui:
  replicas: 1

oauth2Proxy:
  replicas: 1
  backendLogoutUrl: https://sso.staging.example.com/realms/helpdesk/protocol/openid-connect/logout?id_token_hint={id_token}
